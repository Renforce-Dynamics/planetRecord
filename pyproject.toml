[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
authors = [{name = "Renforce Dynamics"}]
maintainers = [{name = "Renforce Dynamics"}]
readme = "README.md"
license = {file = "LICENSE"}
name = "planetr"
version = "0.1.0"
requires-python = ">=3.10"
description = "Robot recording, asynchronous capture and replay"
dependencies = ["planet-config>=0.1,<0.2", "planetr-format>=0.1,<0.2", "planetr-client>=0.1,<0.2"]

[project.scripts]
planetr = "planetr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["planetr*"]

[tool.setuptools.package-data]
"*" = ["**/*.yaml", "**/*.json", "**/*.xml", "**/*.STL", "**/*.stl", "**/*.onnx", "**/*.npz", "**/*.hex", "**/*.md", "**/*.lock", "**/LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Repository = "https://github.com/Renforce-Dynamics/planetRecord"
Issues = "https://github.com/Renforce-Dynamics/planetRecord/issues"
Documentation = "https://github.com/Renforce-Dynamics/planetRecord#readme"
