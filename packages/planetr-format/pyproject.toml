[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
authors = [{name = "Renforce Dynamics"}]
maintainers = [{name = "Renforce Dynamics"}]
readme = "README.md"
license = {file = "LICENSE"}
name = "planetr-format"
version = "0.1.0"
requires-python = ">=3.10"
description = "Versioned recording envelopes and session format contracts"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
include = ["planetr_format*"]

[tool.setuptools.package-data]
"*" = ["**/*.yaml", "**/*.json", "**/*.xml", "**/*.STL", "**/*.stl", "**/*.onnx", "**/*.npz", "**/*.hex", "**/*.md", "**/*.lock", "**/LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Repository = "https://github.com/Renforce-Dynamics/planetRecord"
Issues = "https://github.com/Renforce-Dynamics/planetRecord/issues"
Documentation = "https://github.com/Renforce-Dynamics/planetRecord#readme"
