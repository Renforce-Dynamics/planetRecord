[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
authors = [{name = "Renforce Dynamics"}]
maintainers = [{name = "Renforce Dynamics"}]
readme = "README.md"
license = {file = "LICENSE"}
name = "planetr-client"
version = "0.1.0"
requires-python = ">=3.10"
description = "Bounded asynchronous recording producer client"
dependencies = ["planetr-format>=0.1,<0.2"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["planetr_client*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Repository = "https://github.com/Renforce-Dynamics/planetRecord"
Issues = "https://github.com/Renforce-Dynamics/planetRecord/issues"
Documentation = "https://github.com/Renforce-Dynamics/planetRecord#readme"
